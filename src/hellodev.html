<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HelloDev</title>
  <link rel="stylesheet" href="hellodev.css">
</head>
<body>
  <header class="header">
    <h1 class="logo">HelloDev</h1>
    <div class="header-controls">
      <button class="header-btn edit-mode-btn" id="addWidgetBtn" title="Add Widget" aria-label="Add Widget">
        <span>➕</span>
      </button>
      <button class="header-btn edit-mode-btn" id="customizeBtn" title="Customize Appearance" aria-label="Customize Appearance">
        <span>🖌️</span>
      </button>
      <button class="header-btn edit-mode-btn" id="dataBtn" title="Manage Data" aria-label="Manage Data">
        <span>🗂️</span>
      </button>
      <button class="header-btn edit-mode-btn" id="setupBtn" title="DevDash Setup" aria-label="DevDash Setup">
        <span>&#x1F5A5;&#xFE0F;</span>
      </button>
      <button class="header-btn edit-mode-btn" id="aboutBtn" title="About HelloDev" aria-label="About HelloDev">
        <span>ℹ️</span>
      </button>
      <button class="header-btn" id="editToggle" title="Menu" aria-label="Menu" aria-expanded="false">
        <span class="edit-icon hamburger-icon">☰</span>
      </button>
    </div>
  </header>

  <main class="dashboard" id="dashboard">
    <!-- Widgets are rendered here -->
  </main>

  <script type="module" src="hellodev.js"></script>
</body>
</html>
